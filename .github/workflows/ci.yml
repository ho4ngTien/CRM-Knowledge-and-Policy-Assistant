name: CKPA Quality & Contract CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-lint-and-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ckpa_db
          POSTGRES_USER: ckpa
          POSTGRES_PASSWORD: ckpa_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ckpa -d ckpa_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations against PostgreSQL
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://ckpa:ckpa_pass@localhost:5432/ckpa_db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Mypy type checks
        run: mypy src

      - name: Run Pytest backend contracts
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://ckpa:ckpa_pass@localhost:5432/ckpa_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: pytest -q

  worker-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Run Ruff lint checks on worker
        run: ruff check worker

      - name: Compile worker tasks
        run: python -m compileall worker/src

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend build
        run: npm run build

  csv-contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate UTF-8 CSV headers (passages 21 cols, critical_fields 23 cols)
        run: |
          python -c "
          import csv
          with open('data/templates/passages_template.csv', encoding='utf-8-sig', newline='') as f:
              cols = next(csv.reader(f))
              assert len(cols) == 21, f'Expected 21 cols, got {len(cols)}'
          with open('data/templates/critical_fields_template.csv', encoding='utf-8-sig', newline='') as f:
              cols = next(csv.reader(f))
              assert len(cols) == 23, f'Expected 23 cols, got {len(cols)}'
          print('Template CSV contracts valid')
          "
