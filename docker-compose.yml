# docker-compose.yml — Gate G1 Isolated Dev/Test Stack (SEC 04, SEC 06)
# Tách biệt 100% khỏi môi trường Production (VPC/DB/Storage/Keys cô lập).
# Hỗ trợ tùy biến host port qua .env (POSTGRES_PORT, REDIS_PORT, BACKEND_PORT, FRONTEND_PORT, NGINX_PORT).
#
# Profiles:
#   (default) db, redis         — Phase 1-2: Foundation & Retrieval
#   --profile app               — Full stack: backend + frontend + nginx + worker + beat

services:
  # ── Databases (luôn khởi động trong dev/test cô lập) ──────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ckpa_db
      POSTGRES_USER: ckpa
      POSTGRES_PASSWORD: ckpa_pass
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ckpa_g1_isolated_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckpa -d ckpa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ckpa_g1_isolated_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application services (chỉ dùng khi --profile app) ────────────────────
  backend:
    profiles: [app]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql+asyncpg://ckpa:ckpa_pass@db:5432/ckpa_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LLM_ALLOW_TRAINING: "false"
      LLM_ZERO_DATA_RETENTION: "true"
      LLM_TELEMETRY_ENABLED: "false"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ckpa_g1_isolated_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./prompts:/app/prompts:ro

  worker:
    profiles: [app]
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql+asyncpg://ckpa:ckpa_pass@db:5432/ckpa_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LLM_ALLOW_TRAINING: "false"
      LLM_ZERO_DATA_RETENTION: "true"
      LLM_TELEMETRY_ENABLED: "false"
    security_opt:
      - no-new-privileges:true
    command: celery -A src.celery_app worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ckpa_g1_isolated_net
    volumes:
      - ./worker:/app
      - ./data:/app/data

  beat:
    profiles: [app]
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql+asyncpg://ckpa:ckpa_pass@db:5432/ckpa_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LLM_ALLOW_TRAINING: "false"
      LLM_ZERO_DATA_RETENTION: "true"
      LLM_TELEMETRY_ENABLED: "false"
    security_opt:
      - no-new-privileges:true
    command: celery -A src.celery_app beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ckpa_g1_isolated_net
    volumes:
      - ./worker:/app

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ckpa_g1_isolated_net

  nginx:
    profiles: [app]
    image: nginx:alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ckpa_g1_isolated_net

networks:
  ckpa_g1_isolated_net:
    driver: bridge
    name: ckpa_g1_isolated_net

volumes:
  pgdata:
